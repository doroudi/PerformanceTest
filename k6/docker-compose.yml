# Local authoring & debugging stack only.
# Do not use results from this stack for capacity decisions.
# Prefer staging / production-like environments for real measurements.

services:
  prometheus:
    image: prom/prometheus:v2.54.1   # pin a recent stable tag
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --web.enable-remote-write-receiver
      - --enable-feature=native-histograms
      - --storage.tsdb.retention.time=7d
    ports:
      - "9090:9090"
    volumes:
      - ./prometheus-config.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus-data:/prometheus
    networks:
      - k6

  grafana:
    image: grafana/grafana:11.2.0    # or latest LTS you prefer
    ports:
      - "3000:3000"
    environment:
      - GF_AUTH_ANONYMOUS_ENABLED=true
      - GF_AUTH_ANONYMOUS_ORG_ROLE=Admin
      - GF_AUTH_BASIC_ENABLED=false
      - GF_SECURITY_ALLOW_EMBEDDING=true
      # Optional: set a real password if you ever expose this
      # - GF_SECURITY_ADMIN_PASSWORD=changeme
    volumes:
      - grafana-data:/var/lib/grafana
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - ./grafana/dashboards:/var/lib/grafana/dashboards:ro
    depends_on:
      - prometheus
    networks:
      - k6

  # Optional helper – prefer `docker compose run --rm k6 ...`
  k6:
    image: grafana/k6:0.54.0         # pin the same version you use in CI / baselines
    profiles: ["k6"]                 # only starts when you explicitly request it
    environment:
      # K6_OUT is what actually enables an output. K6_PROMETHEUS_RW_SERVER_URL
      # only says WHERE to send: on its own it does nothing, and the run then
      # succeeds while writing no metrics at all - which is what leaves Grafana
      # empty with no error anywhere to explain it.
      - K6_OUT=experimental-prometheus-rw
      - K6_PROMETHEUS_RW_SERVER_URL=http://prometheus:9090/api/v1/write
      - K6_PROMETHEUS_RW_TREND_STATS=p(90),p(95),p(99),min,max,avg
      # Useful for filtering in Grafana:
      # - K6_PROMETHEUS_RW_TREND_AS_NATIVE_HISTOGRAM=true   (needs the
      #   --enable-feature=native-histograms flag already set on Prometheus below)
      #
      # The output NAME is tied to the k6 version pinned above.
      # `experimental-prometheus-rw` is the correct name for the 0.x line; k6 1.x
      # renamed the output. If you bump the image tag, change this in the same
      # commit - a wrong name makes k6 exit immediately rather than fail quietly.
      # Note k6/Dockerfile pins 1.3.0 for cluster runs: align the two before you
      # compare local and cluster numbers.
    volumes:
      - ./scripts:/scripts:ro
    # Docker Desktop injects host.docker.internal on its own; native Linux Docker
    # does not, and the same -TargetUrl then fails with a DNS error instead of a
    # connection error. host-gateway resolves to the host's bridge address, so this
    # is a no-op on Docker Desktop and the thing that makes it work on Linux/CI.
    #
    # Note this reaches the host's *bridge* interface: a service bound only to
    # 127.0.0.1 is still unreachable that way (it must bind 0.0.0.0 as well).
    extra_hosts:
      - "host.docker.internal:host-gateway"
    networks:
      - k6
    # No default command – you pass it on the CLI

volumes:
  prometheus-data:
  grafana-data:

networks:
  k6:
