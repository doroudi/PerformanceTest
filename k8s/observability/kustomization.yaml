apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

# No `namespace:` transformer here on purpose: prometheus.yaml and grafana.yaml
# already set the namespace on every object, and the ClusterRole and
# ClusterRoleBinding are cluster-scoped - a namespace transformer would stamp the
# namespace onto the binding subject and make the RBAC silently not match.
resources:
  - namespace.yaml
  - prometheus.yaml
  - grafana.yaml
